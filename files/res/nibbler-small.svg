<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Simplified Nibbler icon for 16-32 px: bigger board, thicker line, fewer bends -->
  <defs>
    <clipPath id="board">
      <rect x="28" y="28" width="200" height="200" rx="20"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="#262a36" stroke="#3d4458" stroke-width="8"/>
  <g clip-path="url(#board)">
    <rect x="28" y="28" width="100" height="100" fill="#ecdcbc"/>
    <rect x="128" y="28" width="100" height="100" fill="#9a7652"/>
    <rect x="28" y="128" width="100" height="100" fill="#9a7652"/>
    <rect x="128" y="128" width="100" height="100" fill="#ecdcbc"/>
  </g>
  <polyline points="40,196 108,150 148,170 212,62" fill="none" stroke="#262a36" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="40,196 108,150 148,170 212,62" fill="none" stroke="#f5b83d" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
